<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacer un pedido · q'Queso</title>
<meta name="description" content="Armá tu pedido de quesos, embutidos y fiambres y envialo por WhatsApp.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pedidos.css">
</head>
<body class="pagina-pedidos">

<header class="top">
  <div class="wrap top-fila">
    <a class="volver" href="index.html">← Volver</a>
    <a href="index.html" aria-label="q'Queso, inicio"><img src="logo.png" alt="q'Queso" width="708" height="561"></a>
  </div>
</header>

<main class="wrap pedido">
  <div class="catalogo">
    <h1>Armá tu pedido</h1>
    <p class="aviso">Elegí lo que quieras y lo enviamos por WhatsApp. Los precios son orientativos y los confirmamos al preparar tu pedido.</p>

    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoría"></div>
    <div id="lista" aria-live="polite"></div>
  </div>

  <aside class="carrito" id="carrito" aria-label="Tu pedido">
    <h2>Tu pedido</h2>
    <div id="items"></div>

    <div class="total-fila" id="total-fila" hidden>
      <span>Total estimado</span>
      <strong id="total">$0</strong>
    </div>

    <div id="datos" hidden>
      <label for="nombre">Tu nombre</label>
      <input id="nombre" type="text" autocomplete="name" placeholder="Opcional">
      <label for="nota">Aclaraciones</label>
      <textarea id="nota" rows="3" placeholder="Dirección, retiro, envío, horario, cortes…"></textarea>
      <button class="boton enviar" id="enviar" type="button">Enviar pedido por WhatsApp</button>
      <button class="vaciar" id="vaciar" type="button">Vaciar pedido</button>
    </div>
  </aside>
</main>

<a class="barra" id="barra" href="#carrito" hidden>
  <span id="barra-cant">0 productos</span>
  <strong id="barra-total">$0</strong>
</a>

<script src="productos.js"></script>
<script src="carrito.js"></script>
</body>
</html>
